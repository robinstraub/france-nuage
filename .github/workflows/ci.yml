name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  controlplane-build:
    name: controlplane / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            controlplane/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('controlplane/**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build
        run: cargo build --workspace --manifest-path controlplane/Cargo.toml

  controlplane-lint:
    name: controlplane / lint
    runs-on: ubuntu-latest
    needs: controlplane-build
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            controlplane/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('controlplane/**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Clippy
        run: cargo clippy --workspace --manifest-path controlplane/Cargo.toml -- -D warnings

  controlplane-test:
    name: controlplane / test
    runs-on: ubuntu-latest
    needs: controlplane-build
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: taiki-e/install-action@cargo-llvm-cov

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            controlplane/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('controlplane/**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Test with coverage
        run: cargo llvm-cov --workspace --manifest-path controlplane/Cargo.toml --ignore-filename-regex 'main\.rs' --fail-under-lines 100

  protocol-lint:
    name: protocol / lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: bufbuild/buf-setup-action@v1

      - name: Buf lint
        run: buf lint protocol/

  console-lint:
    name: console / lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: console/package-lock.json

      - name: Install
        run: npm ci
        working-directory: console

      - name: Lint
        run: npm run lint
        working-directory: console

  console-build:
    name: console / build
    runs-on: ubuntu-latest
    needs: console-lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: console/package-lock.json

      - name: Install
        run: npm ci
        working-directory: console

      - name: Build
        run: npm run build
        working-directory: console

  system-tests:
    name: system-tests / e2e
    runs-on: ubuntu-latest
    needs: [controlplane-build, console-build]
    steps:
      - uses: actions/checkout@v4

      - name: Start services
        run: docker compose up -d --build --wait console controlplane keycloak postgres spicedb spicedb-migrate traefik

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: system-tests/package-lock.json

      - name: Install node-sdk
        run: npm ci && npm run build
        working-directory: node-sdk

      - name: Install system-tests
        run: npm ci
        working-directory: system-tests

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: system-tests

      - name: Run E2E tests
        run: npm test
        working-directory: system-tests
        env:
          CONSOLE_URL: http://localhost:5173

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: system-tests/playwright-report/

      - name: Stop services
        if: always()
        run: docker compose down
