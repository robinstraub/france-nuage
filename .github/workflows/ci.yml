name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  controlplane-build:
    name: controlplane / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            controlplane/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('controlplane/**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build
        run: cargo build --workspace --manifest-path controlplane/Cargo.toml

  controlplane-lint:
    name: controlplane / lint
    runs-on: ubuntu-latest
    needs: controlplane-build
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            controlplane/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('controlplane/**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Clippy
        run: cargo clippy --workspace --manifest-path controlplane/Cargo.toml -- -D warnings

  controlplane-test:
    name: controlplane / test
    runs-on: ubuntu-latest
    needs: controlplane-build
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: taiki-e/install-action@cargo-llvm-cov

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            controlplane/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('controlplane/**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Test with coverage
        run: cargo llvm-cov --workspace --manifest-path controlplane/Cargo.toml --ignore-filename-regex 'main\.rs' --fail-under-lines 100

  protocol-lint:
    name: protocol / lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: bufbuild/buf-setup-action@v1

      - name: Buf lint
        run: buf lint protocol/

  console-lint:
    name: console / lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: console/package-lock.json

      - name: Install
        run: npm ci
        working-directory: console

      - name: Lint
        run: npm run lint
        working-directory: console

  console-build:
    name: console / build
    runs-on: ubuntu-latest
    needs: console-lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: console/package-lock.json

      - name: Install
        run: npm ci
        working-directory: console

      - name: Build
        run: npm run build
        working-directory: console
