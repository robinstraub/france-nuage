name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  controlplane-build:
    name: controlplane / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker compose run --rm --no-deps controlplane cargo build --workspace

  controlplane-lint:
    name: controlplane / lint
    runs-on: ubuntu-latest
    needs: controlplane-build
    steps:
      - uses: actions/checkout@v4

      - name: Clippy
        run: docker compose run --rm --no-deps controlplane cargo clippy --workspace -- -D warnings

  controlplane-test:
    name: controlplane / test
    runs-on: ubuntu-latest
    needs: controlplane-build
    steps:
      - uses: actions/checkout@v4

      - name: Test with coverage
        run: docker compose run --rm --no-deps controlplane cargo llvm-cov --workspace --ignore-filename-regex 'main\.rs' --fail-under-lines 100

  protocol-lint:
    name: protocol / lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Buf lint
        run: docker compose run --rm --no-deps --workdir /app controlplane buf lint protocol/

  console-lint:
    name: console / lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint
        run: docker compose run --rm --no-deps console npm run lint

  console-build:
    name: console / build
    runs-on: ubuntu-latest
    needs: console-lint
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker compose run --rm --no-deps console npm run build

  system-tests:
    name: system-tests / e2e
    runs-on: ubuntu-latest
    needs: [controlplane-build, console-build]
    steps:
      - uses: actions/checkout@v4

      - name: Run E2E tests
        run: docker compose run --build -v ${{ github.workspace }}/playwright-report:/app/playwright-report system-tests

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/

      - name: Stop services
        if: always()
        run: docker compose down

  deploy-preview:
    name: deploy / preview
    runs-on: ubuntu-latest
    needs: system-tests
    if: github.event_name == 'pull_request'
    concurrency:
      group: gh-pages-deploy
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: console/package-lock.json

      - name: Build console
        working-directory: console
        env:
          VITE_BASE_PATH: /france-nuage/pr/${{ github.event.pull_request.number }}/
        run: npm ci && npm run build

      - name: Download Playwright report
        uses: actions/download-artifact@v4
        with:
          name: playwright-report
          path: playwright-report

      - name: Assemble preview
        run: |
          mkdir -p preview/pr/${{ github.event.pull_request.number }}
          cp -r console/dist/* preview/pr/${{ github.event.pull_request.number }}/
          cp -r playwright-report preview/pr/${{ github.event.pull_request.number }}/playwright-report

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./preview
          keep_files: true
          enable_jekyll: false

      - name: Find existing comment
        uses: peter-evans/find-comment@v3
        id: find-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: github-actions[bot]
          body-includes: Preview deployment

      - name: Post preview links
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          edit-mode: replace
          body: |
            ## Preview deployment

            | | URL |
            |---|---|
            | Console | https://robinstraub.github.io/france-nuage/pr/${{ github.event.pull_request.number }}/ |
            | Rapport Playwright | https://robinstraub.github.io/france-nuage/pr/${{ github.event.pull_request.number }}/playwright-report/ |
